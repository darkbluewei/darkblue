name: SuperRightClick
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  SuperRightClick:
    type: application
    platform: macOS
    sources:
      - path: main.swift
      - path: AppDelegate.swift
      - path: Actions.swift
      - path: Shared.swift
      - path: blank.docx
        buildPhase: resources
      - path: blank.xlsx
        buildPhase: resources
      - path: blank.pptx
        buildPhase: resources
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleName: SuperRightClick
        CFBundleDisplayName: 超级右键
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.superrightclick.app
            CFBundleURLSchemes:
              - superrightclick
    settings:
      base:
        PRODUCT_NAME: SuperRightClick
        PRODUCT_BUNDLE_IDENTIFIER: com.superrightclick.app
    dependencies:
      - target: FinderExtension
  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync.swift
      - path: Shared.swift
    info:
      path: Config/Extension-Info.plist
      properties:
        CFBundleName: FinderExtension
        CFBundleDisplayName: 超级右键
        LSMinimumSystemVersion: "13.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: Config/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: FinderExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.superrightclick.app.FinderExtension
